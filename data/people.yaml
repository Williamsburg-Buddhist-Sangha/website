  - name: Pankaj Niroula
    role: Secretary
    photo: /images/people/pankaj-niroula.jpg
    bio: >-
      Pankaj is a new resident in Williamsburg and has been working on his PhD
      in Computer Science at William & Mary since 2023.


      He considers “Williamsburg Buddhist Sangha” a precious gift Williamsburg
      presented to him, and has been a regular participant in the meditation
      groups since his arrival here.


      He comes from Kathmandu, Nepal where in 2015, he was introduced to and
      trained in Vipassana meditation as taught by S.N. Goenka. He has greatly
      benefitted from his continued practice and appreciates its role in shaping
      his life since his first retreat.


      He is grateful for his engagement with WBS, with which he believes he gets
      to nurture two of his core values – Compassion and Community.
