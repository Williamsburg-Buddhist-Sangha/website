teachers:
  - name: Ben Thacker-Gwaltney
    role: Lead Teacher
    photo: /images/people/ben-thacker-gwaltney.jpg
    bio: >-
      Ben has been teaching meditation since 2010, and he began meditating in
      2001 at the Joshua Tree Center in Charlottesville, VA with Dr. Mark
      Oberman.  He graduated in 1993 with an M.Div. from Candler School of
      Theology at Emory University in Atlanta. For 20 years he worked in
      community organizing for the nonprofit Virginia Organizing, with a strong
      component in adult education.  He has also completed over 1000 hours of
      experience teaching Yoga for Arthritis with an additional focus on somatic
      meditation. He finds skillful teachings in Theravada, Tibetan Buddhism and
      Zen, but he is a student in the Dharma Path training program of Palpung
      Thubten Choling monastery, in the Kagyu lineage.


      *Ben is one of the rotating teachers of the Monday night meditation group
      at WUU, and he leads a Buddhist book/study group on Thursday mornings at
      WUU. He is Vice-President of the WBS and is Chairperson of the Teachers’
      Committee.*
  - name: John Chowning
    role: Teacher
    photo: /images/people/john-chowning.jpg
    bio: >-
      John has practiced meditation for more than forty years and has studied
      Buddhism for the past 15 years.  He began serving as one of the meditation
      leaders for our Monday Night Buddhist Meditation Group in 2017.


      He has a Masters in Education from the University of Evansville,
      in  Indiana.  He spent most of his career working with the Job Corps
      program, which provides education and job training for disadvantaged young
      adults. He began as an instructor in 1974 and later became an academic
      supervisor at the Earle C. Clements Job Corps Center in Morganfield,
      Kentucky.  In 1989 he took a position at the Job Corps National Office in
      Washington DC, where he soon became responsible for the development of all
      of the program’s academic curricula. John retired in 2015, having worked
      for the US Department of Labor’s Employment Training Administration for 24
      years. While living in Kentucky and Maryland, he also volunteered as an
      adult literacy tutor and a tutor trainer.  His hobbies include songwriting
      and audio engineering.


      *John is President of the Williamsburg Buddhist Sangha.*
  - name: Darrell Key
    role: Teacher
    photo: /images/people/darrell-key.jpg
    bio: Leads the Saturday morning Walking Meditation group
  - name: Scott Varney
    role: Teacher
    photo: /images/people/scott-varney-crop.jpg
    bio: Rotating teacher for Monday and Wednesday night meditation groups.
  - name: Grace Cunningham
    role: Teacher
    photo: /images/people/grace-cunningham.jpg
    bio: Rotating teacher for the Wednesday night meditation group
  - name: Asha McLaughlin
    role: Teacher
    photo: /images/people/asha-mclaughlin.jpg
    bio: >-
      Asha is a long-time Yoga & Meditation teacher, holistic health coach, and
      certified breath coach. She lives in Williamsburg with her husband, Mark
      and their 2 sons.


      Raised in the Roman Catholic tradition, she began her spiritual search for
      a path when she was 27. She found it in a traditional meditation path
      focusing on a blend of Kashmir Shaivism and Tantric philosophy and the
      Vedas and Upanishadic texts from India. She spent years studying and
      engaging in spiritual practices in a monastic setting, both in the US and
      India. Asha also has a great love for Tibetan Buddhism and lived and
      practiced in Dharamsala India.


      Asha is passionate about helping people thrive. She loves to support
      people in releasing stress and finding deep calm within themselves. This
      process allows us to access deeper levels of ourselves, facilitating
      self-discovery. She also leads sacred trips to India with her husband,
      Professor Mark McLaughlin. On these trips, people visit and practice
      meditation and yoga in sacred temples and pilgrimage sites.


      You can find out more about Asha and what she does at:


      <https://bloomwellnessasha.wixsite.com/somatic-therapy>


      Asha teaches meditation on the first Monday of the month.
  - name: Terry Holland
    role: Teacher
    photo: /images/people/terry-holland.jpg
    bio: >-
      Terry is a native of Virginia and has lived in Williamsburg since 2004.\

      Terry was introduced to mindfulness meditation in 2022 through the
      Williamsburg Buddhist Sangha and has been dedicated to her practice ever
      since.


      After retirement from the field of Orthodontics and raising two sons,
      Terry embraced the opportunity to explore her own passions. Drawn to
      Buddhism by its messages of peace,kindness, and compassion she continues
      to deepen her practice and contribute to the sangha’s growth.


      In her free time, Terry enjoys refurbishing cast-off furniture and decor
      giving them a new life through creative restoration.


      Terry leads the Wednesday night meditation group on the fourth week, every
      other month.
  - name: John Davis
    role: Substitute Meditation Group Leader
    photo: /images/people/john-davis.jpg
    bio: >-
      John moved to Williamsburg in the summer of 2019 and began attending WBS
      meditation groups that fall. He has been meditating and practicing yoga
      for a long time. He began attending meditation retreats in the mid-1980s.
      Since then, he’s done dozens of retreats. These retreats have been in
      various traditions and centers, including: Tibetan, Korean Zen, Rinzai
      Zen, IMS (Barre, MA), Southern Dharma Retreat Center and others.


      John is a retired graphic designer who enjoys painting.


      He has a regular daily practice and knows that love, however obscured, is
      at the root of all human emotion.
