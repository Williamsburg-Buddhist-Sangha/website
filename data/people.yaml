  - name: Susan Walkley
    role: Events Committee Chair
    photo: /images/people/susan-walkley.jpg
    bio: >-
      Susan has been interested in Buddhism since minoring in religion in
      college. She completed the Mindfulness Based Stress Reduction class with
      Rebecca Eldridge in 2014 and has meditated regularly since then. She has
      studied Norman Fischer’s Training for Compassion through two different
      classes and has also been involved in other Sangha meditation and book
      study groups.


      When possible, she works to incorporate mindfulness, meditation and
      somatic approaches in her work as an integrative nurse practitioner and
      massage therapist. Different life experiences continue to lead her back to
      explorations of Buddhist traditions.


      She is grateful to have opportunities to connect with other people in the
      local community who are engaging in practice and study and is honored to
      be serving on the Williamsburg Buddhist Sangha Board.
