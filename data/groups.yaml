groups:
  - name: "Monday Evening Yoga before Meditation"
    day: Monday
    time: "6:00–6:45 pm"
    location: "Williamsburg Unitarian Universalist Church, Ironbound Rd"
    zoom_url: ""
    description: |-
      Immediately prior to the weekly meditation–we will offer 45 minutes of Gentle Yin/Restorative Yoga from **6:00 to 6:45 pm**

      Yin/Restorative Yoga is especially suited to meditation sitting.  It combines slow and simple movement with relative stillness.  This  practice calms the nervous system and helps focus the mind. No special clothing is needed, but something comfortable and casual is prudent.

      To participate, you will not need any prior experience with yoga.  We do encourage you to bring either a yoga mat or blanket since we will mostly be on the floor.  A pillow for sitting might be helpful but is not necessary.

      Our yoga teacher will be Shomer Zwelling, one of the founding members of the Williamsburg Sangha and a longtime meditator.  Shomer has been teaching yoga in the Williamsburg area since 2009.
