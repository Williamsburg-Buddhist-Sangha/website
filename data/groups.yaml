  - name: "Saturday Morning Walking Meditation"
    day: Saturday
    time: "8:30 am"
    location: "Greensprings Interpretive Trail, parking lot behind Jamestown High School on Eagle Way"
    zoom_url: ""
    description: |-
      Led by Darrell Key.

      **New Location**

      Because of construction at our usual location, Clara Byrd Baker Elementary School, The trailhead will be closed. We are changing the location for walking meditation to the **Greensprings Interpretive Trail.**

      We will meet in the parking lot behind Jamestown High School on Eagle Way. Eagle Way is the entrance to Jamestown High School on John Tyler Hwy. The parking lot is at the end of Eagle way.

      There will be a brief introduction, followed by silent, meditative walking for about a half an hour.

      Bring an umbrella if it looks like rain, but we will cancel if it is stormy. Simple instructions provided.

      Click [>>HERE<<](https://maps.app.goo.gl/35rnBgp4uPy7KssE8) for a map to Greensprings Interpretative Trail parking lot.

