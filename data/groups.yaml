  - name: "Thursday Morning Book Study and Meditation"
    day: Thursday
    time: "10:00–11:15 am"
    location: "Zoom only"
    zoom_url: "https://us02web.zoom.us/j/95904664491?pwd=RHBzL1JMY04yK2lzWFlCdTROK1BjZz09"
    description: |-
      Led by Ben Thacker-Gwaltney

      **Zoom only.**

      Join Zoom meeting: <https://us02web.zoom.us/j/95904664491?pwd=RHBzL1JMY04yK2lzWFlCdTROK1BjZz09>  
      Or join by phone:  646-558-8656          Meeting ID: 959-0466-4491     Passcode: 558891

      **Book study and meditation**: We are reading: *Open Heart, Open Mind: Awakening the Power of Essence Love*, by **Tsoknyi Rinpoche.**

      Tsoknyi Rinpoche is the brother of Yongey Mingyur Rinpoche.  You will notice some similarities, but also some significant differences between the two.

      All are welcome to join us!

      The book is out of print, but available from many booksellers online, such as [Alibris](https://www.alibris.com/Open-Heart-Open-Mind-Awakening-the-Power-of-Essence-Love-Tsoknyi-Rinpoche/book/28903056?matches=4) or [Abebooks](https://www.abebooks.com/Open-Heart-Mind-Awakening-Power-Essence/32378909649/bd). It is also available as a kindle ‘ebook’.

      ***Open Heart, Open Mind: Awakening the Power of Essence Love by Tsoknyi Rinpoche (with Eric Swanson)*** is a practical, accessible guide to Tibetan Buddhist teachings on mindfulness, love, and wisdom. Blending memoir with meditation guidance, Rinpoche explores how to overcome emotional patterns, connect with “essence love,” and find lasting joy.

      [![Open Heart, Open Mind book cover](/images/open-heart-open-mind.jpg)](https://a.co/d/iWCQNIM)
