<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}" data-design="{{ site.Params.defaultDesign | default "a" }}">
<head>
{{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else }}is-{{ .Kind }}{{ end }}">
<a class="skip-link" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main" tabindex="-1">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ partial "switcher.html" . }}
</body>
</html>
