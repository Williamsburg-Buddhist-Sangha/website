{{- /* Legacy shortcode. In page bodies a link alone in its own paragraph renders as the same
       button (layouts/_partials/content.html). */ -}}
{{- $href := .Get "href" | default (.Get 0) -}}
{{- $style := .Get "style" | default "primary" -}}
<a class="btn btn--{{ $style }}" href="{{ partial "url.html" $href }}"{{ if hasPrefix $href "http" }} rel="noopener"{{ end }}>{{ .Inner | .Page.RenderString }}</a>
