baseURL = 'https://williamsburg-buddhist-sangha.github.io/website/'
languageCode = 'en-us'
title = 'Williamsburg Buddhist Sangha'
enableRobotsTXT = true
buildFuture = true

[params]
  # Preview build: adds noindex and the design switcher. Set false at cutover.
  preview = true
  # Design switcher pill + ?design= / stored choice. false = every visitor sees defaultDesign.
  switcher = false
  defaultDesign = 'a'
  description = 'The Williamsburg Buddhist Sangha offers meditation and study groups, special events, classes and a community for practice and learning in Williamsburg, Virginia.'
  logo = '/images/logo.png'
  email = 'contact@williamsburgbuddhistsangha.org'
  address = 'WBS, Williamsburg Unitarian Universalists, 3051 Ironbound Road, Williamsburg, VA 23185'
  donateURL = 'https://wbs.breezechms.com/give/online'
  newsletterURL = 'https://williamsburgbuddhistsangha.us17.list-manage.com/subscribe?u=fc1ad0b20592452e7a0fbf777&id=4ef0d32acc'

# Design variants (preview switcher order). Each needs assets/css/designs/<id>.css.
# fonts: Google Fonts CSS URL loaded only while that design is active ('' = none).
[[params.designs]]
  id = 'a'
  name = 'Refreshed'
  fonts = 'https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap'

[[params.designs]]
  id = 'b'
  name = 'Calm'
  fonts = 'https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap'

[[params.designs]]
  id = 'c'
  name = 'Editorial'
  fonts = 'https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap'

[[params.designs]]
  id = 'd'
  name = 'Civic'
  fonts = 'https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap'

[[params.designs]]
  id = 'e'
  name = 'First Light'
  fonts = 'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap'

[[params.designs]]
  id = 'f'
  name = 'Garden'
  fonts = 'https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap'

[markup.goldmark.renderer]
  unsafe = true

# The Pages CMS rich-text editor saves underlined text as ++text++. Render it as <ins>.
[markup.goldmark.extensions.extras.insert]
  enable = true

[taxonomies]
